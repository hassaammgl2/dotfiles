# ===============================
# FONT
# ===============================

font_family JetBrainsMono Nerd Font
bold_font FiraCode Nerd Font
italic_font VictorMono Nerd Font
bold_italic_font VictorMono Nerd Font

font_family_symbols NerdFontsSymbolsOnly
font_family_symbols Noto Color Emoji

font_size 10.0


# ===============================
# CURSOR (ONLY REAL ANIMATION KITTY SUPPORTS)
# ===============================

cursor_shape block
cursor_blink true
cursor_blink_interval 0.5
cursor_trail 5
cursor_trail_decay 0.15 0.5

remember_window_size no

tab_bar_edge bottom
tab_bar_style custom
tab_bar_margin_height 0 0
active_tab_font_style bold
inactive_tab_font_style normal


# ===============================
# TERMINAL DESIGN
# ===============================
window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0


# ===============================
# TRANSPARENCY & COLOR
# ===============================
include colors.conf
background_opacity 1
dynamic_background_opacity no

# Warm glass: faint scan + vignette. Blaze trail follows the cursor.
custom_shaders warm


# ===============================
# SPLITS & WINDOW MANAGEMENT
# ===============================
# Splits layout enable karna
enabled_layouts splits,stack,grid,tall

# Splits create karne ke shortcuts (aur nayi window ko usi directory mein kholna)
map ctrl+alt+d launch --location=vsplit --cwd=current
map ctrl+alt+s launch --location=hsplit --cwd=current

# Splits ke darmiyan navigation (Word-by-word jump safe rakhne ke liye Ctrl+Alt use kiya hai)
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up neighboring_window up
map ctrl+alt+down neighboring_window down

# Splits ko shift/move karne ke shortcuts
map ctrl+alt+shift+left move_window left
map ctrl+alt+shift+right move_window right
map ctrl+alt+shift+up move_window up
map ctrl+alt+shift+down move_window down
